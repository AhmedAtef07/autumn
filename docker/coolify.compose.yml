# Production self-host compose for Coolify (build_pack=dockercompose).
# Builds the bun monorepo image ONCE (server service) and reuses it for
# workers / cron / migrate / dashboard. Plus postgres + redis-stack.
#
# Two FQDNs (Traefik wildcard *.atef.cc):
#   https://autumn.atef.cc      -> dashboard (vite SPA, port 3000)
#   https://autumn-api.atef.cc  -> server    (API + better-auth, port 8080)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-autumn}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - autumn-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis-stack:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    volumes:
      - autumn-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: autumn-selfhost:latest
    working_dir: /app
    # Always exit 0 so the deploy proceeds; the real status + any error is
    # captured to /applog/migrate.log (served by the diag service for debugging).
    command:
      - sh
      - -c
      - 'echo "[migrate] ensure extensions $(date)" > /applog/migrate.log; bun /app/docker/db-extensions.ts >> /applog/migrate.log 2>&1; echo "[migrate] run migrations" >> /applog/migrate.log; bun scripts/db/index.ts migrate --bootstrap >> /applog/migrate.log 2>&1; echo "EXIT=$?" >> /applog/migrate.log; cat /applog/migrate.log; exit 0'
    restart: 'no'
    volumes:
      - applog:/applog
    environment:
      - AUTUMN_DB_DIRECT=1
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  diag:
    image: busybox:1.36
    restart: unless-stopped
    command: ['httpd', '-f', '-p', '8090', '-h', '/applog']
    expose:
      - '8090'
    volumes:
      - applog:/applog
    environment:
      - SERVICE_FQDN_DIAG_8090

  server:
    image: autumn-selfhost:latest
    restart: unless-stopped
    working_dir: /app/server
    command: ['bun', 'start']
    environment:
      - SERVICE_FQDN_SERVER_8080
      - NODE_ENV=production
      - SERVER_PORT=8080
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - CLIENT_URL=${CLIENT_URL}
      - ENCRYPTION_IV=${ENCRYPTION_IV}
      - ENCRYPTION_PASSWORD=${ENCRYPTION_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
      - CRITICAL_DATABASE_URL=${CRITICAL_DATABASE_URL}
      - CACHE_URL=${CACHE_URL}
      - REDIS_URL=${REDIS_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_DOMAIN=${RESEND_DOMAIN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis-stack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  workers:
    image: autumn-selfhost:latest
    restart: unless-stopped
    working_dir: /app/server
    command: ['bun', 'src/workers.ts']
    environment:
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - CLIENT_URL=${CLIENT_URL}
      - ENCRYPTION_IV=${ENCRYPTION_IV}
      - ENCRYPTION_PASSWORD=${ENCRYPTION_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
      - CRITICAL_DATABASE_URL=${CRITICAL_DATABASE_URL}
      - CACHE_URL=${CACHE_URL}
      - REDIS_URL=${REDIS_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_DOMAIN=${RESEND_DOMAIN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-stack:
        condition: service_healthy

  cron:
    image: autumn-selfhost:latest
    restart: unless-stopped
    working_dir: /app/server
    command: ['bun', 'src/cron.ts']
    environment:
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - CLIENT_URL=${CLIENT_URL}
      - ENCRYPTION_IV=${ENCRYPTION_IV}
      - ENCRYPTION_PASSWORD=${ENCRYPTION_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
      - CRITICAL_DATABASE_URL=${CRITICAL_DATABASE_URL}
      - CACHE_URL=${CACHE_URL}
      - REDIS_URL=${REDIS_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_DOMAIN=${RESEND_DOMAIN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-stack:
        condition: service_healthy

  dashboard:
    image: autumn-selfhost:latest
    restart: unless-stopped
    working_dir: /app/vite
    # Build the SPA at container start, then serve dist with SPA fallback.
    # NOTE: run from /app/vite (cd) — `vite build --root` is rejected by this
    # vite version, so build from the package dir (root = cwd, config auto-found).
    # Logs to /applog/dashboard.log (served by diag) for observability.
    command:
      - sh
      - -c
      - 'echo "[dash] build start $(date)" > /applog/dashboard.log; (bunx --bun vite build >> /applog/dashboard.log 2>&1; echo "BUILD_EXIT=$?" >> /applog/dashboard.log); ls -la dist >> /applog/dashboard.log 2>&1; echo "[dash] serving $(date)" >> /applog/dashboard.log; exec bun /app/docker/serve-spa.ts /app/vite/dist 3000'
    volumes:
      - applog:/applog
    environment:
      - SERVICE_FQDN_DASHBOARD_3000
      - CI=1
      - NODE_ENV=production
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
      - VITE_FRONTEND_URL=${VITE_FRONTEND_URL}
    depends_on:
      - server

volumes:
  autumn-pg:
  autumn-redis:
  applog:
